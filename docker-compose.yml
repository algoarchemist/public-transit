name: setutrack

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: setutrack
      POSTGRES_PASSWORD: setutrack
      POSTGRES_DB: setutrack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setutrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  emqx:
    image: emqx/emqx:5.8
    ports:
      - "1883:1883" # MQTT
      - "18083:18083" # dashboard (admin/public by default)
    volumes:
      - emqx-data:/opt/emqx/data

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  emqx-data:
