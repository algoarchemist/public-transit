name: setutrack_mobile
description: SetuTrack mobile app — one binary for both passengers and drivers/conductors, role chosen at startup.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.3
  socket_io_client: ^2.0.3+1
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  # Passenger-side
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  # Driver-side
  geolocator: ^13.0.2
  mobile_scanner: ^6.0.2
  mqtt_client: ^10.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
