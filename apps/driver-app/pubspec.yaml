name: setutrack_driver
description: SetuTrack driver/conductor app — trip control, GPS streaming, ticket validation.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  http: ^1.2.2
  geolocator: ^13.0.2
  mobile_scanner: ^6.0.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
