name: setutrack_passenger
description: SetuTrack passenger app — live bus tracking, ETA, ticketing, voice assistant.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
